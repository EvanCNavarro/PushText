<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- The menu-bar glyph, idle (#216, redrawn for #228): the app icon's mark, which is now a
       lowercase "p" - the level meter with its first tile carried down into a descender.

       REDRAWN FOR 18pt, NOT SCALED DOWN, and the difference is the whole reason the p can be used
       here at all. Scaling the icon literally means fitting a mark that is now 698 units tall into
       the same box the old 520-unit mark occupied, which shrinks every tile from 2.29pt wide to
       1.95pt - measured, and visibly thinner in the bar. Instead the waveform keeps the width and
       height it always had and simply MOVES UP 1.2pt, which frees exactly the room the stem needs
       to drop below it. The descender then costs nothing.

       Columns two to five are the old glyph shifted up 1.2: 4.35 -> 3.15, 2.09 -> 0.89, 6.74 ->
       5.54. Column one keeps that new top and runs to 17.4, which is 2.7pt below the tallest tile -
       far enough to read as a descender rather than as a merely taller bar.

       BLACK on transparent, deliberately. It ships as a TEMPLATE image, so macOS ignores the colour
       and uses only the alpha: it tints the glyph for a light or dark menu bar itself. Painting it
       white here would look right on this Mac and disappear on a light menu bar. -->
  <g fill="#000000">
    <rect x="1"     y="5.54" width="2.286" height="11.86" rx="0.8"/>
    <rect x="4.43"  y="3.15" width="2.286" height="9.30"  rx="0.8"/>
    <rect x="7.86"  y="0.89" width="2.286" height="13.82" rx="0.8"/>
    <rect x="11.29" y="3.15" width="2.286" height="9.30"  rx="0.8"/>
    <rect x="14.71" y="5.54" width="2.286" height="4.52"  rx="0.8"/>
  </g>
</svg>
