<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- The menu-bar glyph, idle (#231): PushText's mark drawn on TermTile's grid, so the two apps
       sit next to each other at the same weight.

       BUILT FROM TERMTILE'S GLYPH, not from our icon. Measured from
       ~/Developer/termtile/Resources/TermTileMenuGlyph.svg: tiles 2 wide with rx 1, on a pitch of 3
       at x = 2/5/8/11/14, and a mark occupying y 3..15 - 14 wide by 12 tall inside the same 18pt
       box we use.

       Our previous glyph was 16 wide by 16.5 tall. The width was close; the HEIGHT was 38% over, and
       that is what read as "too large" beside TermTile in the menu bar. Both marks come from the same
       five-column icon grid, so our columns land exactly on TermTile's pitch of 3 once the tile width
       is 2 - the grid was never the problem, only the vertical extent.

       The SHAPE is still ours: the icon's waveform (350/520/350/170) with column one carried down
       into a descender, scaled by 12/698 so the mark spans TermTile's y 3..15 exactly. Column one
       bottoms at 15.00 while the tallest of the others stops at 11.94, so the descender still reads.

       BLACK on transparent: it ships as a TEMPLATE image, so macOS ignores the colour and tints the
       alpha for a light or dark menu bar itself. -->
  <g fill="#000000">
    <rect x="2"  y="6.01" width="2" height="8.99" rx="1"/>
    <rect x="5"  y="4.46" width="2" height="6.02" rx="1"/>
    <rect x="8"  y="3.00" width="2" height="8.94" rx="1"/>
    <rect x="11" y="4.46" width="2" height="6.02" rx="1"/>
    <rect x="14" y="6.01" width="2" height="2.92" rx="1"/>
  </g>
</svg>
