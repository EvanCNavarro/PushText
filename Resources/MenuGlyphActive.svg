<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- The menu-bar glyph while dictation is running (#216, redrawn for #228): the same "p",
       INVERTED - knocked out of a filled squircle rather than drawn as tiles.

       Inverted rather than a second colour, because this ships as a TEMPLATE image: macOS uses only
       the alpha channel, so anything that must read as "active" has to be a difference in SHAPE, not
       in colour. A knockout is legible on a light or a dark menu bar without the app choosing either.

       The squircle's corner ratio is the app icon's own: 205/896 = 0.2288, which on 18 is 4.12. The
       mark inside is the idle glyph scaled by 0.75 so it sits within the fill with air around it -
       the same relationship the previous pair had, carried over to the new letterform.

       The stem still descends past the other tiles inside the knockout. That is what keeps the two
       states recognisably the same mark: if the bowl were re-proportioned to fit, the active icon
       would be a different logo that happened to invert. -->
  <mask id="mark">
    <rect width="18" height="18" rx="4.12" fill="#ffffff"/>
    <g fill="#000000">
      <rect x="3"     y="6.30" width="1.714" height="8.90"  rx="0.6"/>
      <rect x="5.57"  y="4.51" width="1.714" height="6.98"  rx="0.6"/>
      <rect x="8.15"  y="2.81" width="1.714" height="10.37" rx="0.6"/>
      <rect x="10.72" y="4.51" width="1.714" height="6.98"  rx="0.6"/>
      <rect x="13.28" y="6.30" width="1.714" height="3.39"  rx="0.6"/>
    </g>
  </mask>
  <rect width="18" height="18" rx="4.12" fill="#000000" mask="url(#mark)"/>
</svg>
