<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- The menu-bar glyph while dictation is running (#216): the same mark, INVERTED - knocked out of
       a filled squircle rather than drawn as bars.

       Inverted rather than a second colour, because this ships as a TEMPLATE image: macOS uses only
       the alpha channel, so anything that must read as "active" has to be a difference in SHAPE, not
       in colour. A knockout is legible on a light or a dark menu bar without the app choosing either.

       The squircle's corner ratio is the app icon's own: 205/896 = 0.2288, which on 18 is 4.12. The
       bars are the same five tiles scaled to 12 wide so they sit inside the fill with air around
       them, rather than the 16 they occupy when standing alone. -->
  <mask id="bars">
    <rect width="18" height="18" rx="4.12" fill="#ffffff"/>
    <g fill="#000000">
      <rect x="3"     y="7.31" width="1.714" height="3.39"  rx="0.6"/>
      <rect x="5.57"  y="5.51" width="1.714" height="6.98"  rx="0.6"/>
      <rect x="8.14"  y="3.82" width="1.714" height="10.37" rx="0.6"/>
      <rect x="10.71" y="5.51" width="1.714" height="6.98"  rx="0.6"/>
      <rect x="13.29" y="7.31" width="1.714" height="3.39"  rx="0.6"/>
    </g>
  </mask>
  <rect width="18" height="18" rx="4.12" fill="#000000" mask="url(#bars)"/>
</svg>
