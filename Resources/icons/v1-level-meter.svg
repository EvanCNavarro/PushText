<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon, variant 1 (#logo): a 5-tile voice waveform, and nothing else.
       SUPERSEDED by v2-p-mark.svg in #228, and kept because a design you have to `git show` to look
       at does not get compared. `ICON_VARIANT` in scripts/render-icon.sh brings it back in one line.
 Deliberately a SIBLING of
       TermTile's icon, not a copy: same 1024 canvas, same squircle (x/y 64, 896 square, rx 205),
       same vertical gradient, same white tile vocabulary (86 wide, rx 30) on the same five-column
       grid (x 212/341/470/599/728), so the two sit together in a Dock. Only the mark differs -
       TermTile arranges the tiles into a "T"; PushText re-lengthens them into a level meter.

       There WAS a full-width bar underneath, meant as the inserted line of text. It read as an
       underline rather than as text, and it made the icon disagree with every other place the app
       draws itself - the menu-bar SF Symbol `waveform` and the HUD's capsules are both bars alone.
       One mark, everywhere (#210).

       Removing it left the bars sitting high, because they had been balanced against the text line
       rather than against the squircle: they were centred on y=421 where the squircle centres on
       512. All five moved down 91px, so the mark now spans 252..772 and leaves 188px of squircle
       above and below.

       Rendered with scripts/render-icon.sh; build-app.sh makes the .icns from that PNG. -->
  <defs>
    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#26202f"/>
      <stop offset="1" stop-color="#0e0b14"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="205" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="205" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="10"/>
  <g fill="#f4f5f7">
    <!-- waveform: 5 tiles, heights 170/350/520/350/170, all centred on y=512 -->
    <rect x="212" y="427" width="86" height="170" rx="30"/>
    <rect x="341" y="337" width="86" height="350" rx="30"/>
    <rect x="470" y="252" width="86" height="520" rx="30"/>
    <rect x="599" y="337" width="86" height="350" rx="30"/>
    <rect x="728" y="427" width="86" height="170" rx="30"/>
  </g>
</svg>
