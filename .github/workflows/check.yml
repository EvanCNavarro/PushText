name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  # backlog-ids-resolve.sh lists issues. Without this the default token has no issues scope and the
  # gate SKIPS - measured: it reported "could not list issues" and passed, which is a gate that
  # only ever agrees with you.
  issues: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Select Xcode (Swift 6 toolchain)
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Report Swift version
        run: swift --version
      # Sparkle is a local binaryTarget vendored into gitignored Vendor/ — fetch it before ANY
      # swift build/test, or the binary target has no artifact and the build fails.
      - name: Vendor Sparkle
        run: scripts/fetch-sparkle.sh
      - name: Core purity (ADR-0001)
        run: .engine/checks/core-purity.sh
      # Fail-open without gh auth, so a fork PR cannot be blocked by it.
      - name: Cited docs exist
        run: .engine/checks/cited-docs-exist.sh
      - name: Backlog ids resolve to issues
        run: .engine/checks/backlog-ids-resolve.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict
