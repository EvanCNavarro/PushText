name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  # backlog-ids-resolve.sh lists issues. Without this the default token has no issues scope and the
  # gate SKIPS - measured: it reported "could not list issues" and passed, which is a gate that
  # only ever agrees with you.
  issues: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Select Xcode (Swift 6 toolchain)
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Report Swift version
        run: swift --version
      # Sparkle is a local binaryTarget vendored into gitignored Vendor/ — fetch it before ANY
      # swift build/test, or the binary target has no artifact and the build fails.
      - name: Vendor Sparkle
        run: scripts/fetch-sparkle.sh
      - name: Core purity (ADR-0001)
        run: .engine/checks/core-purity.sh
      # Fail-open without gh auth, so a fork PR cannot be blocked by it.
      - name: Cited docs exist
        run: .engine/checks/cited-docs-exist.sh
      - name: Backlog ids resolve to issues
        run: .engine/checks/backlog-ids-resolve.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict

  # The macos-15 job above builds with the macOS 15 SDK, where SpeechAnalyzer does not exist and
  # AppleSpeechEngine is compiled OUT by `#if canImport(FoundationModels)`. Without this job the
  # engine - the most consequential code in the repo - would never be compiled by CI at all, and the
  # gate that hides it would look like coverage. This job builds against the macOS 26 SDK so the
  # engine and its tests actually run.
  check-macos26:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Report Swift and SDK versions
        run: |
          swift --version
          xcrun --show-sdk-version
      - name: Vendor Sparkle
        run: scripts/fetch-sparkle.sh
      # Fails the job if the engine was silently compiled out - a green build proves nothing about
      # AppleSpeechEngine if the SDK gate excluded it, and the two are indistinguishable otherwise.
      - name: Assert the macOS 26 SDK is actually in use
        run: |
          sdk="$(xcrun --show-sdk-version)"
          case "$sdk" in
            26.*) echo "SDK $sdk - AppleSpeechEngine will be compiled" ;;
            *) echo "SDK $sdk is not 26.x; this job exists to compile the macOS 26 engine" >&2; exit 1 ;;
          esac
      - name: Build
        run: swift build
      - name: Test
        run: swift test
