name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  # backlog-matches-github.sh lists issues. Without this the default token has no issues scope and
  # the gate SKIPS - measured: it reported "could not list issues" and passed, which is a gate that
  # only ever agrees with you.
  issues: read

jobs:
  # ONE job on macos-26, not two. Until #16 the package floor was v15, so this job built with the
  # macOS 15 SDK and `#if canImport(FoundationModels)` compiled the speech engine OUT - a green
  # that proved nothing about the most consequential code in the repo. A separate `check-macos26`
  # job existed to cover that hole. The floor is now .v26 and the `#if` scaffolding is gone, so a
  # macos-15 runner cannot resolve the manifest at all and the second job would be a duplicate.
  #
  # `runs-on` is pinned to the floor by .engine/checks/platform-floor-consistent.sh, which also
  # covers release.yml - that one fires only on a tag, so its drift would surface at the first
  # release rather than in the PR that caused it.
  check:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # conventional-subjects.sh diffs against the base branch; the default shallow clone has
          # no merge base, and the check would silently fall back to the PR title alone.
          fetch-depth: 0
      # The squash header comes from the COMMIT subject on a one-commit PR and the PR TITLE on a
      # multi-commit one, so both are gated. Two non-conventional subjects are already on master
      # from PRs whose commits were fine and whose titles were not.
      #
      # PR_TITLE goes through `env`, never `${{ }}` inside `run` - a PR title is text a contributor
      # controls, and interpolating it into a shell is a script injection.
      - name: Commit subjects and PR title are conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/master' }}
        run: .engine/checks/conventional-subjects.sh
      - name: Report Swift and SDK versions
        run: |
          swift --version
          xcrun --show-sdk-version
      # A diagnostic, not a gate against silent exclusion - with the `#if` gone, a wrong SDK is a
      # compile error rather than a quiet omission. It turns that error from a wall of "cannot find
      # type 'SpeechTranscriber'" into one line naming the actual cause.
      - name: Assert the macOS 26 SDK is in use
        run: |
          sdk="$(xcrun --show-sdk-version)"
          case "$sdk" in
            26.*) echo "SDK $sdk - the speech engine will compile" ;;
            *) echo "SDK $sdk is not 26.x; the package floor is macOS 26" >&2; exit 1 ;;
          esac
      # Sparkle is a local binaryTarget vendored into gitignored Vendor/ — fetch it before ANY
      # swift build/test, or the binary target has no artifact and the build fails.
      - name: Vendor Sparkle
        run: scripts/fetch-sparkle.sh
      - name: Core purity (ADR-0001)
        run: .engine/checks/core-purity.sh
      # Cheap, and it covers release.yml - which fires only on a tag, so nothing else in a PR
      # would notice its runner drifting below the package floor (#16).
      - name: Platform floor is consistent
        run: .engine/checks/platform-floor-consistent.sh
      # Fail-open without gh auth, so a fork PR cannot be blocked by it.
      - name: Cited docs exist
        run: .engine/checks/cited-docs-exist.sh
      # #170 shipped twice with an indicator that could never appear, and a RENDER check passed on
      # it. This is the mechanically checkable half of that defect.
      - name: View models are observable
        run: .engine/checks/view-models-are-observable.sh
      - name: Probe gate runs first
        run: .engine/checks/probe-gate-runs-first.sh
      - name: Backlog agrees with GitHub
        run: .engine/checks/backlog-matches-github.sh

      - name: Bundle.module stays DEBUG-only
        run: .engine/checks/bundle-module-guarded.sh

      # Runs BEFORE the suite on purpose: the load it guards against is what makes the suite itself
      # unreliable on this runner, so a red here explains a red down there (#234).
      - name: The tests take one pasteboard
        run: .engine/checks/one-test-pasteboard.sh

      - name: The two Sparkle pins agree
        run: .engine/checks/sparkle-pins-agree.sh

      - name: Install librsvg
        run: brew install librsvg

      - name: The icon PNG matches its SVG source
        run: .engine/checks/icon-render-current.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: swift build
      # #144: roughly one run in ten never finishes the suite - every suite announces itself and
      # NONE completes, against a 70-140s healthy baseline. Both earlier observations were cancelled
      # by hand at ~15 minutes, which is why it is still unknown whether the process hangs or dies,
      # and why no stack was ever captured. With no timeout the job default is SIX HOURS, so a human
      # always cancels first and a cancellation uploads no diagnostics.
      #
      # The script bounds it and SAMPLES BEFORE KILLING. Battle-tested both ways: a planted 90s
      # blocking test exits 124 with a call graph naming the blocked frame, and a healthy run exits
      # 0. `timeout-minutes` is a backstop in case the watchdog itself is what wedges.
      - name: Test
        timeout-minutes: 20
        env:
          PUSHTEXT_TEST_TIMEOUT_SECONDS: 600
        run: ./scripts/test-with-wedge-diagnostics.sh
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict

